<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gündem - TRT Haber</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl md:text-4xl font-extrabold text-center text-red-600 mb-8 tracking-tight">Son Dakika Haberleri</h1>
        
        <div id="haberler" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Haber kartları buraya yüklenecek -->
        </div>
    </div>

    <script>
        async function haberleriGetir() {
            const kapsayici = document.getElementById('haberler');
            try {
                // Aynı klasördeki JSON dosyasını çekiyoruz
                const response = await fetch('haberler.json');
                const veriler = await response.json();

                kapsayici.innerHTML = veriler.map(haber => `
                    <a href="${haber.link}" target="_blank" class="block bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-100 flex flex-col h-full">
                        <div class="h-48 w-full bg-gray-200 overflow-hidden relative">
                            <img src="${haber.resim}" alt="${haber.baslik}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=Görsel+Bulunamadı'">
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <span class="text-xs font-semibold text-gray-400 mb-2">${new Date(haber.tarih).toLocaleDateString('tr-TR')}</span>
                            <h2 class="text-lg font-bold text-gray-900 leading-tight mb-3 line-clamp-2">${haber.baslik}</h2>
                            <p class="text-gray-600 text-sm line-clamp-3 mb-4">${haber.aciklama}</p>
                            <div class="mt-auto inline-flex items-center text-red-600 font-semibold text-sm">
                                Haberi Oku 
                                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (hata) {
                kapsayici.innerHTML = '<p class="text-red-500 text-center col-span-full">Haberler yüklenirken bir sorun oluştu.</p>';
            }
        }

        haberleriGetir();
    </script>
</body>
</html>
