<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gündem - Premium Haber</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins (Daha modern ve yuvarlak hatlı bir font) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
        }

        /* Özel Açılış Animasyonu */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* Animasyon başlamadan önce görünmez */
        }

        /* İçerik metni (Botun kazıdığı) için güzel bir okuma formatı */
        #detay-icerik p {
            margin-bottom: 1.5rem;
            line-height: 1.8;
            color: #374151;
            font-size: 1.125rem;
        }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <!-- ANA SAYFA (Haber Kartları) -->
        <div id="ana-sayfa">
            <div class="flex justify-center items-center mb-12 animate-fade-in">
                <span class="bg-red-100 text-red-600 px-4 py-1 rounded-full font-bold text-sm tracking-wider uppercase shadow-sm">Son Dakika Gelişmeleri</span>
            </div>
            
            <div id="haberler-listesi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Kartlar JavaScript ile buraya yüklenecek -->
            </div>
        </div>

        <!-- DETAY SAYFASI (Okuma Modu) -->
        <div id="detay-sayfasi" class="hidden bg-white p-6 md:p-12 rounded-[2.5rem] shadow-2xl border border-gray-100 mx-auto max-w-4xl mt-4">
            
            <button onclick="geriDon()" class="group mb-8 inline-flex items-center px-5 py-2.5 bg-white border border-gray-200 rounded-full shadow-sm hover:shadow-md hover:border-red-200 transition-all duration-300 text-gray-600 hover:text-red-600 font-semibold">
                <svg class="w-5 h-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                Haberlere Dön
            </button>

            <div class="w-full h-72 md:h-[28rem] rounded-3xl overflow-hidden mb-10 shadow-lg relative">
                <img id="detay-resim" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                <div class="absolute bottom-6 left-6 right-6">
                    <span id="detay-tarih" class="inline-block bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-bold shadow-md mb-3"></span>
                    <h1 id="detay-baslik" class="text-2xl md:text-4xl font-extrabold text-white leading-tight text-shadow-md"></h1>
                </div>
            </div>
            
            <div id="detay-icerik" class="mt-8">
                <!-- Haber içeriği buraya gelecek -->
            </div>
        </div>

    </div>

    <script>
        let globalHaberler = [];

        async function haberleriGetir() {
            const kapsayici = document.getElementById('haberler-listesi');
            try {
                const response = await fetch('haberler.json');
                globalHaberler = await response.json();

                kapsayici.innerHTML = globalHaberler.map((haber, index) => {
                    // Her karta 0.1 saniye artan bir gecikme ekliyoruz ki sırayla düşsünler
                    const gecikme = index * 0.1; 
                    
                    return `
                    <div onclick="haberOku(${index})" class="animate-fade-in cursor-pointer bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgb(0,0,0,0.08)] hover:-translate-y-2 transition-all duration-500 overflow-hidden border border-gray-100 flex flex-col h-full group" style="animation-delay: ${gecikme}s">
                        
                        <div class="h-56 w-full bg-gray-200 overflow-hidden relative">
                            <!-- Tarih Rozeti -->
                            <div class="absolute top-4 left-4 z-10 bg-white/95 backdrop-blur px-3 py-1.5 rounded-xl text-xs font-bold text-red-600 shadow-sm">
                                ${new Date(haber.tarih).toLocaleDateString('tr-TR')}
                            </div>
                            
                            <img src="${haber.resim}" alt="${haber.baslik}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-in-out" onerror="this.src='https://via.placeholder.com/400x200?text=Görsel+Bulunamadı'">
                        </div>

                        <div class="p-6 flex flex-col flex-grow relative">
                            <h2 class="text-xl font-extrabold text-gray-900 leading-snug mb-3 line-clamp-2 group-hover:text-red-600 transition-colors">${haber.baslik}</h2>
                            <p class="text-gray-500 text-sm line-clamp-3 mb-6 leading-relaxed">${haber.aciklama}</p>
                            
                            <!-- Şık Gölgeli Buton -->
                            <div class="mt-auto">
                                <span class="flex items-center justify-center w-full bg-gradient-to-r from-red-500 to-rose-600 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-red-500/30 group-hover:shadow-red-500/50 group-hover:scale-[1.02] transition-all duration-300">
                                    Haberi Oku 
                                    <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </span>
                            </div>
                        </div>
                    </div>
                `}).join('');
            } catch (hata) {
                kapsayici.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 animate-fade-in">
                        <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <p class="text-gray-500 font-semibold text-lg">Haberler yükleniyor veya bot henüz çalışmadı...</p>
                    </div>`;
            }
        }

        function haberOku(index) {
            const haber = globalHaberler[index];
            const detaySayfasi = document.getElementById('detay-sayfasi');
            const anaSayfa = document.getElementById('ana-sayfa');
            
            document.getElementById('detay-resim').src = haber.resim;
            document.getElementById('detay-baslik').innerText = haber.baslik;
            document.getElementById('detay-tarih').innerText = new Date(haber.tarih).toLocaleDateString('tr-TR');
            document.getElementById('detay-icerik').innerHTML = haber.tam_metin;

            anaSayfa.classList.add('hidden');
            detaySayfasi.classList.remove('hidden');
            
            // Detay sayfasını açarken animasyonu tetikle
            detaySayfasi.classList.remove('animate-fade-in');
            void detaySayfasi.offsetWidth; // Tarayıcıyı yenilemeye zorlar
            detaySayfasi.classList.add('animate-fade-in');
            
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function geriDon() {
            const detaySayfasi = document.getElementById('detay-sayfasi');
            const anaSayfa = document.getElementById('ana-sayfa');
            
            detaySayfasi.classList.add('hidden');
            anaSayfa.classList.remove('hidden');
            
            // Ana sayfaya dönerken animasyonu tetikle
            anaSayfa.classList.remove('animate-fade-in');
            void anaSayfa.offsetWidth;
            anaSayfa.classList.add('animate-fade-in');

            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        haberleriGetir();
    </script>
</body>
</html>
