name: İnadına TV'yi Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Haberleri Guncelle"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          ref: main

      - name: GitHub Pages'i Yapılandır
        uses: actions/configure-pages@v5

      - name: Yayın klasörünü hazırla
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp manus-routes.json _site/
          cp haberler.json _site/
          cp bot-raporu.json _site/ 2>/dev/null || true
          cp -R assets _site/assets
          cp -R feeds _site/feeds

      - name: Pages artifact oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
