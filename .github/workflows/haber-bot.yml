name: Haberleri Guncelle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # YENİ EKLENEN ADIM: Kazıma kütüphanesini kuruyoruz
      - name: Gerekli Kütüphaneleri Kur
        run: pip install beautifulsoup4

      - name: Botu Çalıştır ve JSON Üret
        run: python bot.py

      - name: Yapay Zeka verisini doğrula
        run: |
          python - <<'PY'
          import json
          with open('haberler.json', encoding='utf-8') as f:
              haberler = json.load(f)
          ai = [h for h in haberler if h.get('kategori') == 'Yapay Zeka']
          if not ai:
              raise SystemExit('Yapay Zeka verisi boş; mevcut canlı veri korunuyor.')
          print(f'Yapay Zeka haberi: {len(ai)}')

      - name: Güncel Haberleri GitHub'a Gönder
        run: |
          git config --global user.name "Haber Botu"
          git config --global user.email "bot@habersistemi.com"
          git add haberler.json bot-raporu.json feeds/
          git commit -m "Otomatik güncelleme: Tüm içerikler kazındı" || echo "Yeni haber yok"
          git push
      - name: Canlı GitHub Pages dalını güncelle
        run: |
          git fetch origin arena/01a062f8-haberlerim
          git checkout -B pages-sync origin/arena/01a062f8-haberlerim
          git merge --no-edit -X theirs main
          git push origin pages-sync:arena/01a062f8-haberlerim
